name: Rebuild search embeddings

on:
  workflow_dispatch:        # lets you run it manually from the Actions tab
  push:
    branches: [main]
    paths:
      - 'KHNL-GI-Wiki/wiki/**/*.md'
      - 'scripts/build-embeddings.mjs'

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build embeddings
        run: npm run build-embeddings

      - name: Commit updated embeddings
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: rebuild search embeddings [skip ci]'
          file_pattern: 'search/chunks.json search/embeddings.b64'
