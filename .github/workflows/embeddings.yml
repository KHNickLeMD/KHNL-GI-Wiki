name: Rebuild search embeddings

on:
  workflow_dispatch:        # lets you run it manually from the Actions tab
  push:
    branches: [main]
    paths:
      - 'KHNL-GI-Wiki/wiki/**/*.md'
      - 'website_files/scripts/build-embeddings.mjs'

# A newer push supersedes an in-flight rebuild (it rebuilds from newer main);
# without this the older run's push is rejected as non-fast-forward (2026-10-12).
concurrency:
  group: embeddings
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website_files/package-lock.json

      # Runs inside website_files so node_modules is created there, not at the repo root.
      - name: Install dependencies
        run: npm ci  # lockfile-exact installs (security plan P4)
        working-directory: website_files

      - name: Build embeddings
        run: npm run build-embeddings
        working-directory: website_files

      # Pushing while the triggering push's Pages deploy is still in flight
      # cancels it mid-deploy and wedges the next one (prod served a stale,
      # 400-fetch-slow build for 2 days after 2026-07-04's race).
      # ponytail: dumb 2-min delay avoids the deploy-cancel race; upgrade to
      # status-check + POST /pages/builds retry if it ever wedges again.
      - name: Wait out the triggering push's Pages deploy
        run: sleep 120

      # Pushes outside the paths filter (cards, log) can still land during the
      # sleep; fast-forward onto them so the commit below isn't rejected.
      - name: Catch up with main
        run: git pull --ff-only origin main

      - name: Commit updated embeddings
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: rebuild search embeddings [skip ci]'
          file_pattern: 'website_files/search/chunks.json website_files/search/embeddings.b64 website_files/search/wiki-bundle.json'
