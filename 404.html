<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KHNL GI Wiki</title>
<!--
  Single Page Apps for GitHub Pages — clean-URL fallback.
  GitHub Pages is a static host, so a direct visit or refresh of a clean URL
  like /gastroparesis has no matching file and lands here (404). This script
  rewrites the requested path into a query string and redirects to index.html,
  which decodes it back into the real URL before the app boots.
  Technique: rafgraph/spa-github-pages (MIT). Served at the domain root, so
  pathSegmentsToKeep = 0.
-->
<script>
  var pathSegmentsToKeep = 0;
  var l = window.location;
  l.replace(
    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
    l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
    l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
    (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
    l.hash
  );
</script>
</head>
<body></body>
</html>
